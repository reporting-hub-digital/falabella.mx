const ub=(s)=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEY='falaRep_'+D.salt;
async function openWith(raw){
  const k=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(D.iv)},k,ub(D.ct));
  const html=new TextDecoder().decode(pt);
  const nd=new DOMParser().parseFromString(html,'text/html');
  const root=document.importNode(nd.documentElement,true);
  document.replaceChild(root,document.documentElement);
  for(const old of Array.from(root.querySelectorAll('script'))){
    const sc=document.createElement('script');
    for(const a of Array.from(old.attributes))sc.setAttribute(a.name,a.value);
    if(old.type==='application/json'){continue;}
    if(old.src){await new Promise(res=>{sc.onload=sc.onerror=res;old.replaceWith(sc);});}
    else{sc.textContent=old.textContent;old.replaceWith(sc);}
  }
  window.dispatchEvent(new Event('DOMContentLoaded'));window.dispatchEvent(new Event('load'));
}
async function derive(pass){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2',salt:ub(D.salt),iterations:D.it,hash:'SHA-256'},base,256);
}
(async()=>{
  if(!window.crypto||!crypto.subtle){document.getElementById('e').textContent='Abrí el reporte desde su link https (no funciona como archivo local en este navegador).';return;}
  try{Object.keys(localStorage).forEach(k=>{if(k.startsWith('falaRep_')&&k!==KEY)localStorage.removeItem(k);});const s=localStorage.getItem(KEY);if(s){await openWith(ub(s));}}catch(x){try{localStorage.removeItem(KEY);}catch(y){}}
})();
document.getElementById('f').addEventListener('submit',async(ev)=>{
  ev.preventDefault();const b=document.getElementById('b'),e=document.getElementById('e');
  b.disabled=true;b.textContent='Verificando...';e.textContent='';
  try{
    const raw=await derive(document.getElementById('p').value);
    const bytes=new Uint8Array(raw);let s='';bytes.forEach(c=>s+=String.fromCharCode(c));
    if(document.getElementById('r').checked){try{localStorage.setItem(KEY,btoa(s));}catch(x){}}
    await openWith(raw);
  }catch(x){b.disabled=false;b.textContent='Ver reporte';e.textContent='Contraseña incorrecta.';document.getElementById('p').select();}
});
